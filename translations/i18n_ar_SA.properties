\n\
\n\
يوزَّع هذا البرنامج على أمل أن يكون مفيدًا، ولكن دون أي ضمان؛ ودون حتى الضمان الضمني لقابلية التسويق أو الملاءمة لغرض معين. راجع رخصة جنو العمومية العامة لمزيد من التفاصيل.\n\
\n\
\n\
يُفترض أنك تلقيت نسخة من رخصة جنو العمومية العامة مع هذا البرنامج. إن لم يكن الأمر كذلك، فانظر [https\://www.gnu.org/licenses](https\://www.gnu.org/licenses).

